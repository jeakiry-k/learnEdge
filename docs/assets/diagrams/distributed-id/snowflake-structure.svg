<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>雪花算法 64 位结构</title>
<desc>雪花 ID 由 1 位符号位、41 位时间戳、10 位机器 ID、12 位序列号组成</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="28" text-anchor="middle" dominant-baseline="central" fill="#0C447C">雪花算法: 64 bit 长整型, 四段拼接</text>

<!-- 四段位块 -->
<rect x="60" y="55" width="60" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="90" y="75" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">符号位</text>
<text class="ts" x="90" y="95" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">1 bit</text>

<rect x="120" y="55" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="270" y="75" text-anchor="middle" dominant-baseline="central" fill="#0C447C">41 bit 时间戳（毫秒级）</text>
<text class="ts" x="270" y="95" text-anchor="middle" dominant-baseline="central" fill="#0C447C">当前毫秒 - 起始纪元 ≈ 可用 69 年</text>

<rect x="420" y="55" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="480" y="75" text-anchor="middle" dominant-baseline="central" fill="#085041">10 bit 机器 ID</text>
<text class="ts" x="480" y="95" text-anchor="middle" dominant-baseline="central" fill="#085041">1024 台机器</text>

<rect x="540" y="55" width="110" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="595" y="75" text-anchor="middle" dominant-baseline="central" fill="#712B13">12 bit 序列号</text>
<text class="ts" x="595" y="95" text-anchor="middle" dominant-baseline="central" fill="#712B13">每毫秒 4096 个</text>

<!-- 说明箭头 -->
<path d="M270 111 L270 138" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow3)"/>
<path d="M480 111 L480 138" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow3)"/>
<path d="M595 111 L595 138" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow3)"/>

<!-- 说明文字 -->
<rect x="120" y="140" width="300" height="40" rx="8" fill="#F4F9FE" stroke="#B5D4F4" stroke-width="0.5"/>
<text class="ts" x="270" y="160" text-anchor="middle" dominant-baseline="central" fill="#0C447C">时间戳在高位 → 整体趋势递增</text>

<rect x="420" y="140" width="120" height="40" rx="8" fill="#F0FAF6" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="ts" x="480" y="160" text-anchor="middle" dominant-baseline="central" fill="#085041">区分不同节点</text>

<rect x="540" y="140" width="110" height="40" rx="8" fill="#FDF3EF" stroke="#F5C4B3" stroke-width="0.5"/>
<text class="ts" x="595" y="160" text-anchor="middle" dominant-baseline="central" fill="#712B13">同毫秒内自增</text>

<text class="ts" x="340" y="212" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">本地生成、趋势递增、带时间信息 —— 但依赖时钟, 时钟回拨会生成重复 ID</text>
</svg>
