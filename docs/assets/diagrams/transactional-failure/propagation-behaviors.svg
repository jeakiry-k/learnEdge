<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>Spring 七种传播行为一览</title>
<desc>默认 REQUIRED 覆盖绝大多数业务，其余六种要么场景极窄、要么有隐患，开发中很少用</desc>

<text class="th" x="340" y="28" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Spring 七种传播行为：默认值就够用</text>

<text class="ts" x="35" y="58" text-anchor="start" dominant-baseline="central" fill="#085041">① 默认 · 最常用</text>
<rect x="35" y="66" width="610" height="48" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="340" y="82" text-anchor="middle" dominant-baseline="central" fill="#085041">REQUIRED（默认）— 有事务就加入，没有就新建</text>
<text class="ts" x="340" y="100" text-anchor="middle" dominant-baseline="central" fill="#085041">✅ 覆盖绝大多数业务场景</text>

<text class="ts" x="35" y="130" text-anchor="start" dominant-baseline="central" fill="#0C447C">② 偶尔用 · 有隐患</text>
<rect x="35" y="138" width="295" height="58" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="182" y="156" text-anchor="middle" dominant-baseline="central" fill="#0C447C">REQUIRES_NEW</text>
<text class="ts" x="182" y="176" text-anchor="middle" dominant-baseline="central" fill="#0C447C">挂起旧事务，新建独立事务</text>
<rect x="350" y="138" width="295" height="58" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="497" y="156" text-anchor="middle" dominant-baseline="central" fill="#0C447C">NESTED</text>
<text class="ts" x="497" y="176" text-anchor="middle" dominant-baseline="central" fill="#0C447C">嵌套事务（savepoint）</text>

<text class="ts" x="35" y="216" text-anchor="start" dominant-baseline="central" fill="#712B13">③ 几乎不用</text>
<rect x="35" y="224" width="142" height="58" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="106" y="242" text-anchor="middle" dominant-baseline="central" fill="#712B13">SUPPORTS</text>
<text class="ts" x="106" y="262" text-anchor="middle" dominant-baseline="central" fill="#712B13">有则用 / 无则裸跑</text>
<rect x="191" y="224" width="142" height="58" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="262" y="242" text-anchor="middle" dominant-baseline="central" fill="#712B13">NOT_SUPPORTED</text>
<text class="ts" x="262" y="262" text-anchor="middle" dominant-baseline="central" fill="#712B13">强制无事务</text>
<rect x="347" y="224" width="142" height="58" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="418" y="242" text-anchor="middle" dominant-baseline="central" fill="#712B13">NEVER</text>
<text class="ts" x="418" y="262" text-anchor="middle" dominant-baseline="central" fill="#712B13">有事务即报错</text>
<rect x="503" y="224" width="142" height="58" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="574" y="242" text-anchor="middle" dominant-baseline="central" fill="#712B13">MANDATORY</text>
<text class="ts" x="574" y="262" text-anchor="middle" dominant-baseline="central" fill="#712B13">无事务即报错</text>

<text class="ts" x="340" y="306" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">默认 REQUIRED 已覆盖 95% 业务；其余 6 种要么场景极窄、要么有隐患，所以开发中很少用</text>
</svg>
