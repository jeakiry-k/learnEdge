<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>自调用导致事务失效对比</title>
<desc>类内部 this.method 调用绕过代理事务失效，外部调用经过代理事务生效</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="170" y="28" text-anchor="middle" dominant-baseline="central" fill="#993C1D">自调用: this.methodB() 绕过代理</text>

<rect x="55" y="48" width="230" height="40" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="170" y="68" text-anchor="middle" dominant-baseline="central" fill="#712B13">代理对象（被绕过 ⚠）</text>

<path d="M170 88 L170 106" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="55" y="108" width="230" height="84" rx="10" fill="#FDF3EF" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="170" y="128" text-anchor="middle" dominant-baseline="central" fill="#712B13">methodA() 无事务</text>
<path d="M170 142 L170 156" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow3)"/>
<text class="ts" x="170" y="174" text-anchor="middle" dominant-baseline="central" fill="#712B13">this.methodB()</text>
<text class="ts" x="170" y="190" text-anchor="middle" dominant-baseline="central" fill="#712B13">@Transactional</text>

<text class="ts" x="170" y="222" text-anchor="middle" dominant-baseline="central" fill="#993C1D">没走代理 → 无事务拦截 ❌</text>

<line x1="340" y1="42" x2="340" y2="245" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4"/>

<text class="th" x="510" y="28" text-anchor="middle" dominant-baseline="central" fill="#085041">外部调用: 经代理, 事务生效</text>

<rect x="395" y="48" width="230" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="510" y="68" text-anchor="middle" dominant-baseline="central" fill="#085041">Client 调 service.methodA()</text>

<path d="M510 88 L510 106" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="395" y="108" width="230" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="510" y="128" text-anchor="middle" dominant-baseline="central" fill="#04342C">代理对象（事务拦截器）</text>

<path d="M510 148 L510 166" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="395" y="168" width="230" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="510" y="188" text-anchor="middle" dominant-baseline="central" fill="#085041">目标方法 methodA()</text>

<text class="ts" x="510" y="232" text-anchor="middle" dominant-baseline="central" fill="#085041">经代理 → 事务增强生效 ✅</text>
</svg>
