<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>Token 幂等机制流程</title>
<desc>客户端先申请幂等 token，提交时携带，服务端原子校验并删除 token 来区分首次与重复请求</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="170" y="36" width="340" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central" fill="#0C447C">① 客户端申请幂等 token（进入提交页时）</text>

<path d="M340 84 L340 104" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="170" y="108" width="340" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="340" y="124" text-anchor="middle" dominant-baseline="central" fill="#0C447C">② 服务端生成全局唯一 token</text>
<text class="ts" x="340" y="146" text-anchor="middle" dominant-baseline="central" fill="#0C447C">写入 Redis 并设置 TTL</text>

<path d="M340 160 L340 180" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="170" y="184" width="340" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="340" y="200" text-anchor="middle" dominant-baseline="central" fill="#0C447C">③ 客户端提交业务请求</text>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central" fill="#0C447C">请求头 / 参数携带该 token</text>

<path d="M340 236 L340 256" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="170" y="260" width="340" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central" fill="#0C447C">④ 服务端原子校验并删除 token</text>
<text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Redis DEL（Lua 保证原子性）</text>

<path d="M270 316 L200 340" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow3)"/>
<path d="M410 316 L480 340" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="60" y="342" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="195" y="358" text-anchor="middle" dominant-baseline="central" fill="#085041">✅ DEL=1: token 有效</text>
<text class="ts" x="195" y="382" text-anchor="middle" dominant-baseline="central" fill="#085041">首次请求 → 放行执行业务</text>

<rect x="360" y="342" width="260" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="485" y="358" text-anchor="middle" dominant-baseline="central" fill="#712B13">⛔ DEL=0: token 不存在</text>
<text class="ts" x="485" y="382" text-anchor="middle" dominant-baseline="central" fill="#712B13">重复请求 → 直接拒绝</text>

<text class="ts" x="340" y="415" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">校验与删除必须原子: 先 GET 再 DEL 会留下并发窗口</text>
</svg>
