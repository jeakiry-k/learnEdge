<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>横切关注点：散落 vs 集中</title>
<desc>改造前横切逻辑散落在每个方法，改造后抽成切面统一织入</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="28" text-anchor="middle" dominant-baseline="central" fill="#0C447C">AOP 解决横切关注点</text>

<text class="ts" x="180" y="54" text-anchor="middle" dominant-baseline="central" fill="#712B13">改造前 · 逻辑散落在每个方法</text>
<rect x="35" y="64" width="290" height="52" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="180" y="82" text-anchor="middle" dominant-baseline="central" fill="#712B13">createOrder()</text>
<text class="ts" x="180" y="102" text-anchor="middle" dominant-baseline="central" fill="#712B13">业务 + 日志 + 事务 混写</text>
<rect x="35" y="124" width="290" height="52" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="180" y="142" text-anchor="middle" dominant-baseline="central" fill="#712B13">pay()</text>
<text class="ts" x="180" y="162" text-anchor="middle" dominant-baseline="central" fill="#712B13">业务 + 日志 + 权限 混写</text>
<rect x="35" y="184" width="290" height="52" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="180" y="202" text-anchor="middle" dominant-baseline="central" fill="#712B13">refund()</text>
<text class="ts" x="180" y="222" text-anchor="middle" dominant-baseline="central" fill="#712B13">业务 + 日志 + 缓存 混写</text>

<line x1="340" y1="48" x2="340" y2="256" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4"/>

<text class="ts" x="500" y="54" text-anchor="middle" dominant-baseline="central" fill="#085041">改造后 · 抽成切面统一织入</text>
<rect x="355" y="64" width="135" height="172" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="422" y="82" text-anchor="middle" dominant-baseline="central" fill="#085041">核心业务</text>
<text class="ts" x="422" y="112" text-anchor="middle" dominant-baseline="central" fill="#085041">createOrder()</text>
<text class="ts" x="422" y="144" text-anchor="middle" dominant-baseline="central" fill="#085041">pay()</text>
<text class="ts" x="422" y="176" text-anchor="middle" dominant-baseline="central" fill="#085041">refund()</text>

<rect x="510" y="64" width="135" height="172" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="577" y="82" text-anchor="middle" dominant-baseline="central" fill="#0C447C">切面（横切）</text>
<text class="ts" x="577" y="112" text-anchor="middle" dominant-baseline="central" fill="#0C447C">日志切面</text>
<text class="ts" x="577" y="144" text-anchor="middle" dominant-baseline="central" fill="#0C447C">事务切面</text>
<text class="ts" x="577" y="176" text-anchor="middle" dominant-baseline="central" fill="#0C447C">权限切面</text>

<path d="M492 150 L506 150" stroke="#185FA5" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>

<text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">把日志 / 事务 / 权限抽成切面，业务方法只留核心逻辑</text>
</svg>
