<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>JVM 运行时数据区</title>
<desc>线程共享的堆和方法区，线程私有的栈、程序计数器、本地方法栈</desc>

<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central" fill="#0C447C">JVM 运行时数据区（JDK 8+）</text>

<!-- 左侧：线程共享 -->
<rect x="18" y="46" width="320" height="170" rx="12" fill="#F5F2E8" stroke="#C9B76E" stroke-width="0.5"/>
<text class="th" x="178" y="66" text-anchor="middle" dominant-baseline="central" fill="#7A5C00">线程共享（只有一份）</text>

<rect x="34" y="80" width="140" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="104" y="100" text-anchor="middle" dominant-baseline="central" fill="#0C447C">堆 Heap</text>
<text class="ts" x="104" y="122" text-anchor="middle" dominant-baseline="central" fill="#0C447C">对象实例</text>
<text class="ts" x="104" y="138" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">GC 主战场</text>

<rect x="184" y="80" width="140" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="254" y="100" text-anchor="middle" dominant-baseline="central" fill="#0C447C">方法区 / 元空间</text>
<text class="ts" x="254" y="122" text-anchor="middle" dominant-baseline="central" fill="#0C447C">类信息、常量、</text>
<text class="ts" x="254" y="138" text-anchor="middle" dominant-baseline="central" fill="#0C447C">静态变量、JIT 代码</text>

<rect x="34" y="158" width="290" height="46" rx="8" fill="#FFF3E6" stroke="#C97B2B" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="179" y="181" text-anchor="middle" dominant-baseline="central" fill="#9B4A2E">JDK 8：永久代 PermGen 移除 → 元空间 Metaspace</text>

<!-- 右侧：线程私有 -->
<rect x="354" y="46" width="308" height="170" rx="12" fill="#EFF5EF" stroke="#7AA57A" stroke-width="0.5"/>
<text class="th" x="508" y="66" text-anchor="middle" dominant-baseline="central" fill="#2E5C2E">线程私有（每个线程一份）</text>

<rect x="370" y="80" width="130" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="435" y="100" text-anchor="middle" dominant-baseline="central" fill="#085041">虚拟机栈</text>
<text class="ts" x="435" y="120" text-anchor="middle" dominant-baseline="central" fill="#085041">栈帧：局部变量表</text>
<text class="ts" x="435" y="136" text-anchor="middle" dominant-baseline="central" fill="#085041">操作数栈、返回地址</text>

<rect x="510" y="80" width="138" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="579" y="100" text-anchor="middle" dominant-baseline="central" fill="#085041">本地方法栈</text>
<text class="ts" x="579" y="120" text-anchor="middle" dominant-baseline="central" fill="#085041">native 方法</text>
<text class="ts" x="579" y="136" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">（HotSpot 已合并）</text>

<rect x="370" y="158" width="278" height="46" rx="8" fill="#EDEAF6" stroke="#6B5B95" stroke-width="0.5"/>
<text class="ts" x="509" y="181" text-anchor="middle" dominant-baseline="central" fill="#4A3A7A">程序计数器：当前字节码指令地址（唯一不会 OOM）</text>

<!-- 堆的展开 -->
<text class="th" x="340" y="244" text-anchor="middle" dominant-baseline="central" fill="#0C447C">堆的内部结构（分代）</text>

<rect x="34" y="260" width="612" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="34" y="260" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="134" y="280" text-anchor="middle" dominant-baseline="central" fill="#085041">新生代 Young</text>
<text class="ts" x="134" y="300" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">新对象诞生地</text>
<rect x="240" y="260" width="406" height="60" rx="8" fill="#FBE8E0" stroke="#C26A4A" stroke-width="0.5"/>
<text class="ts" x="443" y="280" text-anchor="middle" dominant-baseline="central" fill="#9B3A1E">老年代 Old</text>
<text class="ts" x="443" y="300" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">熬过多次 GC 仍存活的对象</text>

<text class="ts" x="134" y="340" text-anchor="middle" dominant-baseline="central" fill="#085041">新生代再细分</text>
<rect x="34" y="350" width="122" height="34" rx="6" fill="#EDEAF6" stroke="#6B5B95" stroke-width="0.5"/>
<text class="ts" x="95" y="367" text-anchor="middle" dominant-baseline="central" fill="#4A3A7A">Eden 8</text>
<rect x="160" y="350" width="76" height="34" rx="6" fill="#EDEAF6" stroke="#6B5B95" stroke-width="0.5"/>
<text class="ts" x="198" y="367" text-anchor="middle" dominant-baseline="central" fill="#4A3A7A">S0 1</text>
<rect x="240" y="350" width="76" height="34" rx="6" fill="#EDEAF6" stroke="#6B5B95" stroke-width="0.5"/>
<text class="ts" x="278" y="367" text-anchor="middle" dominant-baseline="central" fill="#4A3A7A">S1 1</text>
<text class="ts" x="480" y="367" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">默认 8:1:1，Eden 打满触发 Minor GC</text>

<text class="ts" x="340" y="388" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">共享区放所有线程都要用的对象与类，私有区放每个线程自己的调用栈</text>
</svg>
