<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>BIO 与多路复用对比</title>
<desc>BIO 一个线程管一个连接，NIO 多路复用一个线程管多个连接</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="170" y="35" text-anchor="middle" dominant-baseline="central" fill="#993C1D">BIO: 一连接一线程</text>
<circle cx="80" cy="85" r="20" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="80" y="85" text-anchor="middle" dominant-baseline="central" fill="#712B13">线程</text>
<circle cx="80" cy="155" r="20" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="80" y="155" text-anchor="middle" dominant-baseline="central" fill="#712B13">线程</text>
<circle cx="80" cy="225" r="20" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="80" y="225" text-anchor="middle" dominant-baseline="central" fill="#712B13">线程</text>

<rect x="240" y="67" width="80" height="36" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="280" y="85" text-anchor="middle" dominant-baseline="central" fill="#712B13">连接 1</text>
<rect x="240" y="137" width="80" height="36" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="280" y="155" text-anchor="middle" dominant-baseline="central" fill="#712B13">连接 2</text>
<rect x="240" y="207" width="80" height="36" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="280" y="225" text-anchor="middle" dominant-baseline="central" fill="#712B13">连接 3</text>

<path d="M100 85 L235 85" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow3)"/>
<path d="M100 155 L235 155" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow3)"/>
<path d="M100 225 L235 225" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow3)"/>

<text class="ts" x="170" y="268" text-anchor="middle" dominant-baseline="central" fill="#993C1D">1万连接 = 1万线程, 内存与切换成本爆炸</text>

<line x1="350" y1="40" x2="350" y2="255" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4"/>

<text class="th" x="515" y="35" text-anchor="middle" dominant-baseline="central" fill="#085041">NIO: 多路复用</text>
<circle cx="410" cy="150" r="20" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="410" y="150" text-anchor="middle" dominant-baseline="central" fill="#04342C">线程</text>

<rect x="465" y="128" width="110" height="44" rx="8" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="520" y="144" text-anchor="middle" dominant-baseline="central" fill="#04342C">Selector</text>
<text class="ts" x="520" y="162" text-anchor="middle" dominant-baseline="central" fill="#04342C">(epoll 内核)</text>

<path d="M430 150 L460 150" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="600" y="60" width="60" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="630" y="76" text-anchor="middle" dominant-baseline="central" fill="#085041">连接 1</text>
<rect x="600" y="112" width="60" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="630" y="128" text-anchor="middle" dominant-baseline="central" fill="#085041">连接 2</text>
<rect x="600" y="164" width="60" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="630" y="180" text-anchor="middle" dominant-baseline="central" fill="#085041">连接 3</text>
<rect x="600" y="216" width="60" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="630" y="232" text-anchor="middle" dominant-baseline="central" fill="#085041">... N</text>

<path d="M575 140 L597 80" fill="none" stroke="#0F6E56" stroke-width="1" />
<path d="M575 145 L597 130" fill="none" stroke="#0F6E56" stroke-width="1" />
<path d="M575 155 L597 180" fill="none" stroke="#0F6E56" stroke-width="1" />
<path d="M575 160 L597 230" fill="none" stroke="#0F6E56" stroke-width="1" />

<text class="ts" x="515" y="268" text-anchor="middle" dominant-baseline="central" fill="#085041">一个线程轮询所有连接, 谁有数据就处理谁</text>
</svg>