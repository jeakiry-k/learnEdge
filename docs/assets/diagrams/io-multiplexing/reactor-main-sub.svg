<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>主从 Reactor 的运行与分流</title>
<desc>Main Reactor 只管 accept，多个 Sub Reactor 各自负责一部分连接的 I/O，单线程瓶颈被拆散</desc>
<defs>
<marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="30" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">主从 Reactor: I/O 从独木桥变成多条并行车道</text>

<rect x="60" y="70" width="100" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="110" y="88" text-anchor="middle" dominant-baseline="central" fill="#444441">新连接请求</text>

<path d="M160 88 L225 88" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar2)"/>

<rect x="230" y="55" width="150" height="66" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="305" y="78" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Main Reactor</text>
<text class="ts" x="305" y="100" text-anchor="middle" dominant-baseline="central" fill="#185FA5">只管 accept, 极轻</text>

<path d="M305 121 L140 175" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#ar2)"/>
<path d="M305 121 L305 175" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#ar2)"/>
<path d="M305 121 L470 175" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#ar2)"/>
<text class="ts" x="410" y="150" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">accept 后按轮询"发牌"注册</text>

<rect x="60" y="180" width="160" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="140" y="203" text-anchor="middle" dominant-baseline="central" fill="#085041">Sub Reactor 1</text>
<text class="ts" x="140" y="225" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">自己名下的 ~6 千连接</text>
<text class="ts" x="140" y="245" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">独立线程跑 select</text>
<text class="ts" x="140" y="265" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">read / write</text>

<rect x="225" y="180" width="160" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="305" y="203" text-anchor="middle" dominant-baseline="central" fill="#085041">Sub Reactor 2</text>
<text class="ts" x="305" y="225" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">自己名下的 ~6 千连接</text>
<text class="ts" x="305" y="245" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">独立线程跑 select</text>
<text class="ts" x="305" y="265" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">read / write</text>

<rect x="390" y="180" width="160" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="470" y="203" text-anchor="middle" dominant-baseline="central" fill="#085041">Sub Reactor 16</text>
<text class="ts" x="470" y="225" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">自己名下的 ~6 千连接</text>
<text class="ts" x="470" y="245" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">独立线程跑 select</text>
<text class="ts" x="470" y="265" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">read / write</text>

<rect x="575" y="180" width="80" height="110" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="615" y="205" text-anchor="middle" dominant-baseline="central" fill="#0C447C">业务</text>
<text class="ts" x="615" y="225" text-anchor="middle" dominant-baseline="central" fill="#0C447C">线程池</text>
<text class="ts" x="615" y="245" text-anchor="middle" dominant-baseline="central" fill="#185FA5">(可选)</text>

<path d="M550 235 L570 235" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#ar2)"/>

<text class="ts" x="340" y="315" text-anchor="middle" dominant-baseline="central" fill="#444441">16 个 Sub 在 16 个核上并行跑, 每个只扛 1/16 的 I/O, 单线程瓶颈消失</text>
</svg>