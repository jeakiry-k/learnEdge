<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>多线程 Reactor 的运行与瓶颈</title>
<desc>所有连接的 accept 和 I/O 都汇聚到单个 Reactor 线程，业务线程池只解决了业务阻塞，没有解决 I/O 汇聚</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="30" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">多线程 Reactor: 所有 I/O 仍走一根独木桥</text>

<rect x="60" y="65" width="90" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="105" y="82" text-anchor="middle" dominant-baseline="central" fill="#085041">连接 1</text>
<rect x="60" y="115" width="90" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="105" y="132" text-anchor="middle" dominant-baseline="central" fill="#085041">连接 2</text>
<rect x="60" y="165" width="90" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="105" y="182" text-anchor="middle" dominant-baseline="central" fill="#085041">连接 3</text>
<rect x="60" y="215" width="90" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="105" y="232" text-anchor="middle" dominant-baseline="central" fill="#085041">... 10 万个</text>

<path d="M150 82 L230 120" fill="none" stroke="#0F6E56" stroke-width="1"/>
<path d="M150 132 L230 140" fill="none" stroke="#0F6E56" stroke-width="1"/>
<path d="M150 182 L230 160" fill="none" stroke="#0F6E56" stroke-width="1"/>
<path d="M150 232 L230 180" fill="none" stroke="#0F6E56" stroke-width="1"/>

<rect x="235" y="95" width="150" height="110" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text class="th" x="310" y="118" text-anchor="middle" dominant-baseline="central" fill="#712B13">Reactor 线程</text>
<text class="ts" x="310" y="138" text-anchor="middle" dominant-baseline="central" fill="#993C1D">仅 1 个</text>
<text class="ts" x="310" y="160" text-anchor="middle" dominant-baseline="central" fill="#993C1D">accept + 全部连接的</text>
<text class="ts" x="310" y="180" text-anchor="middle" dominant-baseline="central" fill="#993C1D">read / write 分发</text>

<path d="M385 150 L455 150" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar1)"/>
<text class="ts" x="420" y="136" text-anchor="middle" dominant-baseline="central" fill="#185FA5">数据包</text>

<rect x="460" y="95" width="160" height="110" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="540" y="118" text-anchor="middle" dominant-baseline="central" fill="#0C447C">业务线程池</text>
<text class="ts" x="540" y="140" text-anchor="middle" dominant-baseline="central" fill="#185FA5">解析 / 查库 / 计算</text>
<text class="ts" x="540" y="160" text-anchor="middle" dominant-baseline="central" fill="#185FA5">可多线程并行</text>
<text class="ts" x="540" y="182" text-anchor="middle" dominant-baseline="central" fill="#185FA5">这里不是瓶颈</text>

<path d="M420 200 C 420 250 380 250 350 210" fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar1)"/>
<text class="ts" x="430" y="245" text-anchor="middle" dominant-baseline="central" fill="#185FA5">结果回来由 Reactor 写回</text>

<rect x="215" y="80" width="190" height="140" rx="12" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="th" x="310" y="70" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">瓶颈: 单线程扛 10 万连接的 I/O</text>

<text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central" fill="#444441">业务线程池解决的是"业务阻塞 I/O", 但 I/O 本身仍然挤在一个线程上</text>
</svg>