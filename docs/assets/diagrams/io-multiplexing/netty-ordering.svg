<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 325" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>Netty 的 IO 顺序保证</title>
<desc>Channel 终身绑定固定 EventLoop，外部线程的写入封装成 task 排队，单线程事件循环本身就是栅栏</desc>
<defs>
<marker id="aro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Netty 顺序保证: 绑定 + 任务队列 = 天然栅栏</text>

<rect x="40" y="70" width="130" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="105" y="90" text-anchor="middle" dominant-baseline="central" fill="#085041">Channel X</text>
<text class="ts" x="105" y="110" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">注册即终身绑定</text>

<rect x="40" y="200" width="130" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="105" y="220" text-anchor="middle" dominant-baseline="central" fill="#444441">业务线程</text>
<text class="ts" x="105" y="240" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">channel.write()</text>

<path d="M170 98 L240 98" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#aro)"/>
<text class="ts" x="205" y="86" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">绑定</text>

<rect x="245" y="55" width="260" height="230" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="375" y="77" text-anchor="middle" dominant-baseline="central" fill="#0C447C">EventLoop-3（单线程）</text>

<rect x="265" y="95" width="220" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="375" y="116" text-anchor="middle" dominant-baseline="central" fill="#0C447C">1. select() 等 IO 事件</text>

<rect x="265" y="153" width="220" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="375" y="174" text-anchor="middle" dominant-baseline="central" fill="#0C447C">2. 处理就绪的 read / write</text>

<rect x="265" y="211" width="220" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="375" y="232" text-anchor="middle" dominant-baseline="central" fill="#0C447C">3. 跑任务队列（外部塞入的 task）</text>

<path d="M375 137 L375 149" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#aro)"/>
<path d="M375 195 L375 207" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#aro)"/>
<path d="M265 232 C 246 232 246 116 262 116" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#aro)"/>

<path d="M170 228 L262 228" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aro)"/>
<text class="ts" x="216" y="212" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">封装成 task 入队</text>

<text class="ts" x="592" y="120" text-anchor="middle" dominant-baseline="central" fill="#444441">跨连接无需有序:</text>
<text class="ts" x="592" y="140" text-anchor="middle" dominant-baseline="central" fill="#444441">不同 Channel 绑在</text>
<text class="ts" x="592" y="160" text-anchor="middle" dominant-baseline="central" fill="#444441">不同 EventLoop 上</text>
<text class="ts" x="592" y="180" text-anchor="middle" dominant-baseline="central" fill="#444441">并行执行</text>

<text class="ts" x="340" y="306" text-anchor="middle" dominant-baseline="central" fill="#444441">同一连接的所有事件在同一个线程上按轮次串行 —— 单线程事件循环本身就是栅栏</text>
</svg>
