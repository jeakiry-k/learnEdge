<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="100%" role="img">
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<title>Reactor 模型三阶段演进</title>
<desc>单线程 Reactor、多线程 Reactor、主从 Reactor 的演进对比</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="30" y="30" width="180" height="180" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="120" y="55" text-anchor="middle" dominant-baseline="central" fill="#0C447C">单线程 Reactor</text>
<rect x="55" y="75" width="130" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="120" y="95" text-anchor="middle" dominant-baseline="central" fill="#0C447C">一个线程包干</text>
<text class="ts" x="120" y="140" text-anchor="middle" dominant-baseline="central" fill="#0C447C">accept + read</text>
<text class="ts" x="120" y="160" text-anchor="middle" dominant-baseline="central" fill="#0C447C">+ 业务处理</text>
<text class="ts" x="120" y="190" text-anchor="middle" dominant-baseline="central" fill="#993C1D">瓶颈: 单核跑满就挂</text>

<path d="M220 120 L258 120" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="268" y="30" width="180" height="180" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="358" y="55" text-anchor="middle" dominant-baseline="central" fill="#0C447C">多线程 Reactor</text>
<rect x="293" y="75" width="130" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="358" y="95" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Reactor 仍单线程</text>
<text class="ts" x="358" y="140" text-anchor="middle" dominant-baseline="central" fill="#0C447C">业务处理丢给</text>
<text class="ts" x="358" y="160" text-anchor="middle" dominant-baseline="central" fill="#0C447C">worker 线程池</text>
<text class="ts" x="358" y="190" text-anchor="middle" dominant-baseline="central" fill="#993C1D">瓶颈: 连接数爆炸时</text>
<text class="ts" x="358" y="205" text-anchor="middle" dominant-baseline="central" fill="#993C1D">单线程 I/O 扛不住</text>

<path d="M458 120 L496 120" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="506" y="30" width="170" height="180" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="591" y="55" text-anchor="middle" dominant-baseline="central" fill="#085041">主从 Reactor</text>
<rect x="526" y="75" width="60" height="36" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="556" y="93" text-anchor="middle" dominant-baseline="central" fill="#085041">Main</text>
<rect x="596" y="75" width="64" height="36" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="628" y="93" text-anchor="middle" dominant-baseline="central" fill="#085041">Sub×N</text>
<text class="ts" x="591" y="140" text-anchor="middle" dominant-baseline="central" fill="#085041">Main 只管 accept</text>
<text class="ts" x="591" y="160" text-anchor="middle" dominant-baseline="central" fill="#085041">Sub 管 read/write</text>
<text class="ts" x="591" y="190" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Netty 采用此模型</text>
</svg>