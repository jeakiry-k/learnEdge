{% extends "base.html" %}

{% block styles %}
  {{ super() }}
  <style>
    :root {
      --md-text-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --md-code-font: "SF Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    }

    html { scroll-behavior: auto !important; overscroll-behavior: none !important; }
    body { overscroll-behavior: none !important; }
    .md-main { overscroll-behavior: none !important; }
    .md-content { overscroll-behavior: none !important; }

    /* ===== 顶部标题栏 ===== */
    .md-header {
      background: var(--md-default-bg-color);
      box-shadow: none;
      border-bottom: 1px solid var(--md-default-fg-color--lightest);
    }
    .md-header__inner {
      display: flex !important;
      align-items: center;
      padding: 0 1rem;
      height: 48px;
      gap: 0;
    }

    /* 左侧：logo + 题库，宽度与 TOC 一致 */
    .md-header__button.md-logo {
      display: inline-flex !important;
      align-items: center;
      gap: 0.35rem;
      margin: 0 !important;
      padding: 0 !important;
      width: 200px;
      flex-shrink: 0;
    }
    .md-header__button.md-logo svg {
      width: 20px;
      height: 20px;
      fill: var(--md-default-fg-color);
    }
    .logo-text {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--md-default-fg-color);
      white-space: nowrap;
    }

    .md-header__button.md-icon[for="__drawer"] { display: none; }

    /* 中间：标题，与内容区左对齐 */
    .md-header__title {
      display: flex !important;
      align-items: center;
      flex: 1;
      min-width: 0;
      padding: 0;
    }
    .md-header__ellipsis {
      display: flex !important;
      align-items: center;
      width: 100%;
    }
    /* 第一个 topic（站点名）display:none 时仍绝对定位占位，
       与第二个 topic（页标题）堆叠 → H5 窄屏文字重叠。
       强制去掉绝对定位并禁用 Material 的滑入滑出动画。 */
    .md-header__topic {
      position: static !important;
      transform: none !important;
      transition: none !important;
    }
    .md-header__topic:not([data-md-component="header-topic"]) {
      display: none !important;
    }
    .md-header__topic[data-md-component="header-topic"] {
      display: inline-block !important;
      opacity: 1 !important;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--md-default-fg-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 600px;
      flex: 1;
      min-width: 0;
    }
    .md-header__topic[data-md-component="header-topic"] .md-ellipsis {
      display: inline;
    }

    /* 首页：header 中间标题文案置空，但保留占位以维持布局 */
    body.is-home .md-header__topic[data-md-component="header-topic"] .md-ellipsis {
      visibility: hidden;
    }

    /* 隐藏 palette 和 source */
    .md-header__option[data-md-component="palette"] { display: none !important; }
    .md-header__button--source { display: none !important; }
    .md-source { display: none !important; }

    /* 右侧：搜索框 + GitHub，固定靠右 */
    .header-right {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 6px;
    }

    /* 搜索框 */
    .header-search .md-search {
      display: flex;
    }
    .header-search .md-search__form {
      border-radius: 5px !important;
    }
    .header-search .md-search__input {
      border-radius: 5px !important;
    }

    /* GitHub logo */
    .gh-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .gh-link svg {
      width: 23px;
      height: 23px;
      fill: var(--md-default-fg-color--light);
      transition: fill 0.15s;
    }
    .gh-link:hover svg { fill: var(--md-accent-fg-color); }

    /* ===== 隐藏左侧问题列表 ===== */
    .md-sidebar--primary { display: none !important; }

    /* ===== TOC 移到左侧，干净的单条分割线 ===== */
    .md-main__inner { flex-direction: row !important; margin-top: 0 !important; }
    .md-sidebar--secondary {
      order: -1 !important;
      width: 200px !important;
      min-width: 200px !important;
      border: none;
      margin: 0 !important;
      padding: 0 !important;
    }
    /* scrollwrap 承载右侧分割线 */
    .md-sidebar--secondary .md-sidebar__scrollwrap {
      border-right: 1px solid var(--md-default-fg-color--lightest) !important;
      margin: 0;
      padding: 0;
      height: 100%;
    }
    .md-sidebar--secondary .md-sidebar__inner {
      border: none;
      padding: 2rem 1rem 2rem 1rem;
      margin: 0;
    }
    .md-sidebar--secondary .md-nav__title { display: none !important; }
    .md-sidebar--secondary .md-nav {
      margin: 0;
    }
    .md-sidebar--secondary .md-nav__link {
      font-size: 0.78rem;
      padding: 0.2rem 0;
      color: var(--md-default-fg-color--light);
      line-height: 1.5;
    }
    .md-sidebar--secondary .md-nav__link:hover { color: var(--md-accent-fg-color); }
    .md-sidebar--secondary .md-nav__link--active {
      color: var(--md-accent-fg-color);
      font-weight: 500;
    }

    /* ===== 内容区 ===== */
    .md-content {
      flex: 1;
      min-width: 0;
    }
    .md-content__inner { padding: 2.5rem 2rem 4rem; }
    .md-content__inner::before { display: none; }

    .md-content h1 { font-weight: 700; font-size: 1.75rem; margin-bottom: 0.5rem; line-height: 1.3; color: var(--md-default-fg-color); }
    .md-content h2 { font-weight: 600; font-size: 1.25rem; margin-top: 2.5rem; border-bottom: none; color: var(--md-default-fg-color); }
    .md-content h3 { font-weight: 600; font-size: 1rem; margin-top: 1.8rem; color: var(--md-default-fg-color); }
    .md-content p { line-height: 1.75; color: var(--md-default-fg-color); font-size: 0.9rem; }
    .md-content ul, .md-content ol { font-size: 0.9rem; line-height: 1.75; }

    .md-content table { border-collapse: collapse; width: 100%; font-size: 0.85rem; margin: 1rem 0; display: table; overflow: visible; }
    .md-content table:not([class]) { border: none; border-radius: 0; background: none; display: table; max-width: 100%; overflow: visible; }
    .md-content th { border-bottom: 2px solid var(--md-default-fg-color--lighter); border-top: none; padding: 0.6rem 1rem; text-align: left; font-weight: 600; font-size: 0.85rem; }
    .md-content td { border-top: 1px solid var(--md-default-fg-color--lightest); border-bottom: none; padding: 0.5rem 1rem; font-size: 0.85rem; }

    .md-content pre { border-radius: 8px; font-size: 0.82rem; margin: 1rem 0; background: var(--md-code-bg-color); }
    .md-content pre > code { padding: 1rem 1.2rem; font-size: 0.82rem; line-height: 1.6; font-family: var(--md-code-font); background: transparent; }
    .md-content code { font-size: 0.82rem; border-radius: 4px; font-family: var(--md-code-font); }
    .md-content :not(pre) > code { background: var(--md-code-bg-color); padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.82rem; }

    .md-content blockquote { border-left: 3px solid var(--md-accent-fg-color); padding: 0.3rem 1rem; margin: 1rem 0; color: var(--md-default-fg-color--light); background: transparent; font-size: 0.9rem; }
    .md-content hr { border: none; border-top: 1px solid var(--md-default-fg-color--lightest); margin: 2rem 0; }

    .question-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0 1.5rem; }
    .question-tag { font-size: 0.75rem; padding: 0.15rem 0.6rem; border-radius: 3px; background: var(--md-default-fg-color--lightest); color: var(--md-default-fg-color--light); white-space: nowrap; cursor: pointer; transition: all 0.15s; }
    .question-tag:hover { background: var(--md-accent-fg-color); color: #fff; }

    .md-footer { display: none; }

    /* ===== 移动端适配 ===== */
    /* ≤1220px：对齐 Material 抽屉行为，恢复汉堡按钮 + 主导航抽屉 */
    @media screen and (max-width: 76.234375em) {
      .md-header__button.md-icon[for="__drawer"] { display: inline-flex !important; order: -1; }
      .md-header__button.md-logo { order: 0; }
      .md-sidebar--primary { display: block !important; }
    }

    /* ≤960px：隐藏 TOC，压缩留白，表格/代码横向滚动 */
    @media screen and (max-width: 960px) {
      .md-sidebar--secondary { display: none !important; }
      /* 移动端题目页：隐藏 logo，只展示汉堡菜单 */
      body:not(.is-home) .md-header__button.md-logo { display: none !important; }
      .md-header__topic[data-md-component="header-topic"] { max-width: 40vw; }
      .md-content__inner { padding: 1.5rem 1rem 3rem; }
      .md-content h1 { font-size: 1.4rem; }
      .md-content h2 { font-size: 1.15rem; margin-top: 2rem; }
      .md-content table,
      .md-content table:not([class]) { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .md-content pre { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }

    /* ≤480px：进一步压缩 */
    @media screen and (max-width: 480px) {
      .md-content__inner { padding: 1.25rem 0.85rem 2.5rem; }
      .md-content h1 { font-size: 1.3rem; }
      .logo-text { font-size: 0.85rem; }
      .md-content p, .md-content ul, .md-content ol { font-size: 0.88rem; }
    }
  </style>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var headerInner = document.querySelector('.md-header__inner');

      // 1. logo + 题库
      var logoBtn = document.querySelector('.md-header__button.md-logo');
      if (logoBtn && !logoBtn.querySelector('.logo-text')) {
        var textSpan = document.createElement('span');
        textSpan.className = 'logo-text';
        textSpan.textContent = 'JAVA题库';
        logoBtn.appendChild(textSpan);
      }

      // 2. 删除 aria-label="导航栏"
      var navs = document.querySelectorAll('[aria-label="导航栏"]');
      navs.forEach(function(n) { n.removeAttribute('aria-label'); });

      // 2b. 首页：把 header 中间标题文案置空（保留布局，不影响搜索按钮位置）
      var isHomepage = window.location.pathname === '/' || window.location.pathname.endsWith('/learnEdge/') || window.location.pathname.endsWith('/learnEdge');
      if (isHomepage) {
        document.body.classList.add('is-home');
        var headerTopicEllipsis = document.querySelector('.md-header__topic[data-md-component="header-topic"] .md-ellipsis');
        if (headerTopicEllipsis) {
          headerTopicEllipsis.textContent = '';
        }
      }

      // 2b. 移动端：把 __drawer 汉堡按钮移到 logo 前面（左侧）
      var drawerBtn = document.querySelector('.md-header__button.md-icon[for="__drawer"]');
      if (drawerBtn && logoBtn && drawerBtn !== logoBtn.previousElementSibling) {
        headerInner.insertBefore(drawerBtn, logoBtn);
      }

      // 3. 搜索框 + GitHub 放到右侧容器，搜索框在 GitHub 左侧 50px
      var searchForm = document.querySelector('.md-search');
      if (searchForm && headerInner && !headerInner.querySelector('.header-right')) {
        var rightDiv = document.createElement('div');
        rightDiv.className = 'header-right';

        var searchWrapper = document.createElement('div');
        searchWrapper.className = 'header-search';
        searchWrapper.appendChild(searchForm);
        rightDiv.appendChild(searchWrapper);

        var ghLink = document.createElement('a');
        ghLink.href = 'https://github.com/jeakiry-k/learnEdge';
        ghLink.target = '_blank';
        ghLink.className = 'gh-link';
        ghLink.setAttribute('aria-label', 'GitHub');
        ghLink.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>';
        rightDiv.appendChild(ghLink);

        headerInner.appendChild(rightDiv);
      }

      // 4. 标签点击 → 搜索
      var tags = document.querySelectorAll('.question-tag');
      tags.forEach(function(tag) {
        tag.addEventListener('click', function() {
          var query = tag.textContent.trim();
          var searchToggle = document.querySelector('.md-search__icon');
          if (searchToggle) { searchToggle.click(); }
          setTimeout(function() {
            var input = document.querySelector('.md-search__input');
            if (input) {
              input.value = query;
              input.dispatchEvent(new Event('input', { bubbles: true }));
              input.focus();
            }
          }, 150);
        });
      });
    });
  </script>
{% endblock %}
