site_name: JAVA题库
site_description: JAVA面试题与知识点合集
site_author: kjeakiry
repo_url: https://github.com/jeakiry-k/learnEdge

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
    - scheme: slate
      primary: blue grey
      accent: blue
  font: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - toc:
      permalink: false

plugins:
  - search:
      lang:
        - ja
        - en

nav:
  - 首页: index.md
  - 浏览器与网络分类: category/browser-network/index.md
  - Redis 分类: category/redis/index.md
  - MySQL 分类: category/mysql/index.md
  - 工程化分类: category/engineering/index.md
  - Java 基础分类: category/java-basic/index.md
  - 题目列表:
      - IO 模型与多路复用：从 BIO 到 Reactor: java-basic/io-multiplexing.md
      - Redis 为什么这么快：设计与实现: redis/why-fast.md
      - Java 线程的六种状态与状态流转: java-basic/thread-states.md
      - Java 单例模式的几种实现方式: java-basic/singleton.md
      - 线程池工作原理: java-basic/thread-pool.md
      - MySQL 中 IP 地址的存储与转换: mysql/ip-storage.md
      - == 和 equals 的区别: java-basic/hashcode-equals.md
      - Redis 数据结构: redis/data-structures.md
      - 长连接 vs 短连接 & HTTP 连接池: browser-network/http-connection-pool.md
      - MySQL 字段类型与存储空间估算: mysql/field-types.md
      - 缓存穿透、击穿、雪崩: redis/cache-issues.md
      - Redis 连接池: redis/connection-pool.md
      - TCP 三次握手与四次挥手: browser-network/tcp-handshake-farewell.md
      - 短链服务系统设计: engineering/url-shortener.md
      - HTTP 缓存策略: browser-network/http-caching.md
