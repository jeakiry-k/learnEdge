site_name: 面试知识合集
site_description: 前端面试题与知识点合集
site_author: kjeakiry
repo_url: https://github.com/kjeakiry/learnedge
repo_name: kjeakiry/learnedge
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - ja
        - en

nav:
  - 首页: index.md
  - JavaScript:
      - 概览: javascript/index.md
      - 事件循环: javascript/event-loop.md
      - 闭包: javascript/closure.md
  - CSS:
      - 概览: css/index.md
      - 居中方案: css/centering.md
  - HTML:
      - 概览: html/index.md
  - React:
      - 概览: react/index.md
  - Vue:
      - 概览: vue/index.md
  - 浏览器与网络:
      - 概览: browser-network/index.md
      - HTTP 缓存策略: browser-network/http-caching.md
  - 算法与数据结构:
      - 概览: algorithm/index.md
  - 工程化:
      - 概览: engineering/index.md
  - 性能优化:
      - 概览: performance/index.md
