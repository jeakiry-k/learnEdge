site_name: 面试知识合集
site_description: 前端面试题与知识点合集
site_author: kjeakiry
repo_url: https://github.com/kjeakiry/learnedge
repo_name: kjeakiry/learnedge
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: white
      accent: blue
    - scheme: slate
      primary: blue grey
      accent: blue
  font: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"

plugins:
  - search:
      lang:
        - ja
        - en

nav:
  - 首页: index.md
  - JavaScript:
      - 事件循环: javascript/event-loop.md
      - 闭包: javascript/closure.md
  - CSS:
      - 居中方案: css/centering.md
  - 浏览器与网络:
      - HTTP 缓存策略: browser-network/http-caching.md
  - 工程化:
      - 短链服务系统设计: engineering/url-shortener.md
