site_name: 题库
site_description: 前端面试题与知识点合集
site_author: kjeakiry
repo_url: https://github.com/jeakiry-k/learnEdge

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
    - scheme: slate
      primary: blue grey
      accent: blue
  font: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - toc:
      permalink: false

plugins:
  - search:
      lang:
        - ja
        - en

nav:
  - 首页: index.md
  - JavaScript 分类: category/javascript/index.md
  - CSS 分类: category/css/index.md
  - 浏览器与网络分类: category/browser-network/index.md
  - 工程化分类: category/engineering/index.md
  - 题目列表:
      - 事件循环: javascript/event-loop.md
      - 闭包: javascript/closure.md
      - 线程、进程、协程的区别: javascript/thread-process-coroutine.md
      - 居中方案: css/centering.md
      - HTTP 缓存策略: browser-network/http-caching.md
      - 短链服务系统设计: engineering/url-shortener.md
